[project]
name = "reliable-task-agent"
version = "0.2.0"
description = "A reliable agent runtime for crash recovery, deterministic verification, and side-effect-safe tool execution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
reliable-task-agent = "reliable_task_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
benchmark = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
